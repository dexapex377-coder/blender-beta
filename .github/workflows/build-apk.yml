name: Android APK Package

on:
  # Fires on a successful native build without `needs:`, so the two run as independent
  # jobs and the APK can also be dispatched by hand against an older .so.
  workflow_run:
    workflows: ["Android Native Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      native_run:
        description: 'Run id of build-native.yml to take the .so from (blank = latest)'
        required: false
        default: ''

# Packaging only. libblender.so and the staged runtime payload come from the
# gradle-stage artifact, so this job takes minutes rather than the hour a full Blender
# rebuild costs. Dispatch it on its own whenever the native side is already green.

jobs:
  assemble:
    # workflow_run fires for failures too; only package when the native side is green.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # download-artifact@v4 scopes to the *current* run when run-id is empty, so a
      # hand-dispatched packaging job finds nothing and dies with
      # 'Unable to download artifact(s): Not Found' even though gradle-stage is sitting
      # there from the native build minutes earlier. Resolve the id first.
      - name: Resolve which native run to package
        id: native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_RUN: ${{ inputs.native_run }}
          EVENT: ${{ github.event_name }}
          TRIGGERING_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -o pipefail
          RID="$NATIVE_RUN"
          if [ -z "$RID" ] && [ "$EVENT" = "workflow_run" ]; then
            RID="$TRIGGERING_RUN"
          fi
          if [ -z "$RID" ]; then
            RID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-native.yml/runs?status=success&per_page=1" \
                    --jq '.workflow_runs[0].id')
          fi
          [ -n "$RID" ] || { echo "ERROR: no successful build-native.yml run to package"; exit 1; }
          echo "Packaging native run $RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Download staged Gradle project
        uses: actions/download-artifact@v4
        with:
          name: gradle-stage
          run-id: ${{ steps.native.outputs.run_id }}
          # Pulling an artifact from a different run than this one needs a token;
          # without it the action only looks at the current run and reports
          # 'Artifact not found' even though the artifact is there.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract staged Gradle project
        run: |
          set -o pipefail
          # download-artifact@v4 unzips the artifact contents directly into $GITHUB_WORKSPACE
          # (no subfolder for single artifacts), so the tarball lands in the workspace root.
          ls -la
          mkdir -p stage
          tar -I zstd -xf gradle-stage.tar.zst -C stage
          # gradlew is a generated wrapper script and is not tracked in git, so it never
          # reaches the artifact. Recreate it from the Gradle distribution instead of
          # depending on a file that is not there.
          GRADLE_VERSION=$(sed -n 's/.*gradle-\([0-9.]*\)-bin.zip/\1/p' \
            stage/build_files/android/apk/gradle/wrapper/gradle-wrapper.properties | head -1)
          echo "Gradle version: $GRADLE_VERSION"
          GRADLE_DIST="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSL -o /tmp/gradle.zip "$GRADLE_DIST"
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf "/opt/gradle-${GRADLE_VERSION}/bin/gradle" /usr/local/bin/gradle
          gradle --version | head -4
          echo "Staged layout:"
          ls stage
          ls stage/build_files/android/apk | head

      - name: Resolve launcher icons through LFS
        run: |
          set -o pipefail
          # The launcher PNGs are LFS pointers. They were smudged in the build job, but
          # package.sh only copies the Gradle project, and a GitHub upload of pointers is
          # not a smudge, so the artifact carries 129 byte files and AAPT rejects them with
          # 'file failed to compile'. Pull them from this repository into the staged copy.
          APK_DIR="$GITHUB_WORKSPACE/stage/build_files/android/apk"
          git clone --depth 1 --branch main "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" lfs-src
          cd lfs-src
          git lfs install --local
          git lfs pull --include="build_files/android/apk/app/src/main/res/**" \
            || echo "::warning::some launcher objects unavailable"
          cp -R build_files/android/apk/app/src/main/res/. "$APK_DIR/app/src/main/res/"
          echo "Launcher icon sizes:"
          find "$APK_DIR/app/src/main/res" -name 'ic_launcher*.png' -printf '%s %p\n' | head -4

      - name: Verify the staged Gradle project
        run: |
          set -o pipefail
          # The wrapper JAR is a Git LFS object and never arrives in the artifact, so there
          # is nothing to verify there; the distribution downloaded in the previous step is
          # what actually builds the APK. Check the project instead: the build files have to
          # be real, and the payload the stage refers to has to be there.
          APK_DIR=stage/build_files/android/apk
          for f in build.gradle settings.gradle gradle.properties app/build.gradle \
                   gradle/wrapper/gradle-wrapper.properties; do
            test -s "$APK_DIR/$f" \
              || { echo "ERROR: missing or empty $APK_DIR/$f"; exit 1; }
          done
          test -s stage/android_apk_stage_full/lib/arm64-v8a/libblender.so \
            || { echo "ERROR: staged payload has no libblender.so"; exit 1; }
          # A 129 byte launcher icon is an LFS pointer AAPT will refuse; catch it here with a
          # message that says so, instead of a wall of AAPT errors.
          STUB=$(find stage/build_files/android/apk/app/src/main/res -name 'ic_launcher*.png' \
            -size -1k 2>/dev/null | head -1)
          [ -z "$STUB" ] || { echo "ERROR: $STUB is still an LFS stub"; exit 1; }
          echo "Gradle version pinned: $(sed -n 's/.*gradle-\([0-9.]*\)-bin.zip/\1/p' "$APK_DIR/gradle/wrapper/gradle-wrapper.properties" | head -1)"
          echo "Staged libs: $(ls stage/android_apk_stage_full/lib/arm64-v8a | wc -l)"
          echo "Staged project OK"

      # THIS STEP IS THE ACTUAL FIX for 'cannot locate symbol _ZNSt6__ndk113__hash_memoryEPKvm'.
      #
      # libblender.so has that undefined reference -- it comes from the prebuilt static
      # archives, not from our sources:
      #   $ llvm-nm --undefined-only lib/android_arm64/abseil/lib/libabsl_cord.a | grep hash
      #   $ llvm-nm --undefined-only lib/android_arm64/draco/lib/libdraco.a  | grep hash
      #   U _ZNSt6__ndk113__hash_memoryEPKvm      (both)
      #
      # ANDROID_STL is c++_shared (platform_android_toolchain.cmake), so it must be resolved
      # by the libc++_shared.so that ships in the APK. package.sh:49 copies that file straight
      # out of the NDK sysroot:
      #   cp "$ANDROID_SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNI/"
      # With no NDK set up here it falls back to env.sh's default, 28.2.13676358, so the APK
      # carries a *different* STL than the one libblender.so was linked against and dlopen
      # fails at launch.
      #
      # Measured with `llvm-nm -D --defined-only` on each sysroot's aarch64 libc++_shared.so
      # (dl.google.com/android/repository/android-ndk-<r>-linux.zip):
      #   28.2.13676358  r28c        -- not exported
      #   29.0.14206865  r29         -- not exported
      #   30.0.14904198  r30-beta1   T _ZNSt6__ndk113__hash_memoryEPKvm
      #   30.0.16248370  r30 final   T _ZNSt6__ndk113__hash_memoryEPKvm
      # r30 is the release channel one, so this job and the native job must both say 'r30'.
      #
      # Do NOT pin the bare semver '30.0.14904198'. That is r30-beta1 (its repository2-3.xml
      # entry carries <preview>1</preview>); nttld/setup-ndk@v1 will not resolve a preview
      # revision from a plain semver and the job dies immediately with
      # 'Attempting to download 30.0.14904198... Error: Unexpected HTTP response: 404'.
      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
          link-to-sdk: true

      # The build above only guarantees the native job *could* see r30. It does not guarantee
      # the file that ended up in the staged payload is r30's: package.sh copies libc++_shared.so
      # out of whatever $ANDROID_NDK_ROOT resolves to, and env.sh silently defaults that to NDK
      # 28. Check what is actually going into the APK, and put the right one there if not.
      - name: Verify (and fix) the staged libc++_shared.so
        run: |
          set -o pipefail
          JNI=stage/android_apk_stage_full/lib/arm64-v8a
          SYM=_ZNSt6__ndk113__hash_memoryEPKvm
          SRC="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -s "$SRC" || { echo "ERROR: r30 sysroot libc++_shared.so not found at $SRC"; exit 1; }
          echo "--- staged ---"
          test -s "$JNI/libc++_shared.so" || echo "WARNING: staged payload has no libc++_shared.so"
          if test -s "$JNI/libc++_shared.so" && readelf --dyn-syms -W "$JNI/libc++_shared.so" | grep -q "$SYM"; then
            echo "OK: staged libc++_shared.so already exports $SYM"
          else
            echo "staged libc++_shared.so is missing $SYM -- replacing it with the r30 one"
            readelf --dyn-syms -W "$SRC" | grep -q "$SYM" \
              || { echo "ERROR: even r30's libc++_shared.so does not export $SYM"; exit 1; }
            cp -f "$SRC" "$JNI/libc++_shared.so"
            readelf --dyn-syms -W "$JNI/libc++_shared.so" | grep -q "$SYM" \
              || { echo "ERROR: replacement did not take"; exit 1; }
            echo "OK: replaced"
          fi
          # Report, but do not fail on, any other libc++ (__ndk1) symbol libblender.so needs and
          # the staged runtime does not export. This is the shape the launch crash takes, so it
          # is worth seeing even when it is not fatal for the current source.
          if command -v llvm-nm >/dev/null; then
            NEEDED=$(llvm-nm -u -D "$JNI/libblender.so" 2>/dev/null \
                      | awk '{print $NF}' | grep '^_ZNSt6__ndk1' | sort -u)
            HAVE=$(llvm-nm -D --defined-only "$JNI/libc++_shared.so" 2>/dev/null \
                     | awk '{print $NF}' | sort -u)
            MISSING=$(comm -23 <(printf '%s\n' "$NEEDED") <(printf '%s\n' "$HAVE"))
            if [ -n "$MISSING" ]; then
              echo "::warning::libc++ symbols libblender.so needs but libc++_shared.so does not export:"
              printf '%s\n' "$MISSING" | sed 's/^/::warning::  /'
            else
              echo "OK: every __ndk1 symbol libblender.so needs is exported by libc++_shared.so"
            fi
          else
            echo "llvm-nm unavailable; skipping the full __ndk1 cross-check"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle Wrapper distributions
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          # The distribution version is pinned in gradle-wrapper.properties (Gradle 9.4.1).
          key: gradle-wrapper-${{ hashFiles('stage/build_files/android/apk/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          # Keyed on the pinned Gradle + AGP configuration so incompatible dependency sets are
          # never reused (exact key only, no restore-key fallback). AGP is pinned to 9.2.0 in
          # build.gradle and the wrapper to Gradle 9.4.1.
          key: gradle-caches-${{ hashFiles('stage/build_files/android/apk/gradle/wrapper/gradle-wrapper.properties','stage/build_files/android/apk/build.gradle','stage/build_files/android/apk/settings.gradle','stage/build_files/android/apk/gradle.properties','stage/build_files/android/apk/app/build.gradle') }}

      - name: Ensure Android SDK build platform is available
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "platforms;android-36 present"
          else
            echo "platforms;android-36 missing — installing (licenses are pre-accepted on runners)"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ -x "$SDKM" ]; then
              yes | "$SDKM" "platforms;android-36"
            else
              echo "sdkmanager not found; letting AGP auto-download instead"
            fi
          fi

      # The version was passed as literals -- 5.2.0 / 5020000 -- which is a version this tree
      # has not been for months, and the stale versionCode is not merely cosmetic: it is lower
      # than an installed build's, so adb refuses the upgrade with
      #   INSTALL_FAILED_VERSION_DOWNGRADE: Update version code 5020000 is older than current
      # Read it from the source instead. BLENDER_VERSION is major*100 + minor (503 is 5.3), and
      # the code mirrors platform_android_gradle.cmake's gradle_assemble:
      #   abi_prefix * 100000000 + major * 1000000 + minor * 10000 + patch * 100
      # which for 5.3.0 on arm64-v8a is 105030000.
      - name: Derive the APK version from the source
        id: version
        run: |
          set -o pipefail
          H=$(find . -name BKE_blender_version.h -not -path '*/.git/*' 2>/dev/null | head -1)
          if [ -z "$H" ] || [ ! -f "$H" ]; then
            echo "::warning::BKE_blender_version.h not in the staged project; keeping 105030000"
            echo "version_name=5.3.0 Beta" >> "$GITHUB_OUTPUT"
            echo "version_code=105030000" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VER=$(sed -n 's/^#define BLENDER_VERSION[[:space:]]\{1,\}\([0-9]*\).*/\1/p' "$H" | head -1)
          PATCH=$(sed -n 's/^#define BLENDER_VERSION_PATCH[[:space:]]\{1,\}\([0-9]*\).*/\1/p' "$H" | head -1)
          CYCLE=$(sed -n 's/^#define BLENDER_VERSION_CYCLE[[:space:]]\{1,\}\([A-Za-z]*\).*/\1/p' "$H" | head -1)
          [ -n "$VER" ] || { echo "ERROR: cannot parse BLENDER_VERSION from $H"; exit 1; }
          MAJOR=$(( VER / 100 )); MINOR=$(( VER % 100 ))
          [ -n "$PATCH" ] || PATCH=0
          [ -n "$CYCLE" ] || CYCLE=release
          NAME="$MAJOR.$MINOR.$PATCH $CYCLE"
          CODE=$(( 1 * 100000000 + MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 ))
          echo "read $H -> $MAJOR.$MINOR.$PATCH $CYCLE"
          echo "APK will report versionName='$NAME' versionCode=$CODE"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Assemble APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          # package.sh stages the payload next to the Gradle project, so point Gradle at
          # the jniLibs/assets dirs the same way package.sh's staging expects.
          cd stage/build_files/android/apk
          gradle assembleRelease \
            -PblenderVersionName="${{ steps.version.outputs.version_name }}" \
            -PblenderVersionCode="${{ steps.version.outputs.version_code }}" \
            -PblenderMinSdk=29 \
            -PblenderStageBase="$GITHUB_WORKSPACE/stage" 2>&1 | tee gradle.log

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find stage/build_files/android/apk -name "app-release.apk" 2>/dev/null | head -1)
          echo "apk_path=$APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        if: steps.find-apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-apk
          path: ${{ steps.find-apk.outputs.apk_path }}

      - name: Upload Gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            stage/gradle/gradle.log
            gradle-stage.tar.zst
          if-no-files-found: ignore