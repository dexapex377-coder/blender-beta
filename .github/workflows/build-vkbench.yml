name: Build vkbench Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NDK r30
        run: |
          curl -fSL --retry 5 --retry-delay 5 https://dl.google.com/android/repository/android-ndk-r30-linux.zip -o /tmp/ndk-r30-linux.zip
          unzip -q -o /tmp/ndk-r30-linux.zip -d /tmp/ndk-r30
          echo "NDK_ROOT=/tmp/ndk-r30/android-ndk-r30" >> $GITHUB_ENV

      - name: Install Vulkan headers (host)
        run: |
          sudo apt-get update -y && sudo apt-get install -y libvulkan-dev

      - name: Compile vkbench for Android arm64-v8a
        run: |
          NDK=$NDK_ROOT
          CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++
          $CC -O2 -o vkbench-android \
            vkbench/main.cpp \
            -I/usr/include/vulkan \
            -ldl -lm -llog
          readelf -h vkbench-android | head -5

      - name: Upload vkbench binary
        uses: actions/upload-artifact@v4
        with:
          name: vkbench-android
          path: vkbench-android
          retention-days: 7
