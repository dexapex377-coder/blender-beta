name: Android Native Build

on:
  workflow_dispatch:

# The full Blender cross-build (7642 targets) is expensive (~40 min) and only depends on the
# Blender source, the NDK and the precompiled libs. The APK assembly itself is a light Gradle
# step that consumes the staged Gradle project produced by the CMake `gradle_stage` target.
#
# To avoid recompiling every Blender target when only the final APK step fails, the pipeline is
# split in two jobs:
# This job only produces the native side: libblender.so plus the staged runtime payload,
# published as the `gradle-stage` artifact. Assembling the APK lives in build-apk.yml, which
# consumes that artifact without `needs:` and can be dispatched on its own, so a failure in
# Gradle never costs an hour of Blender recompiling.
#
# NOTE on Git LFS: the repo tracks release/datafiles, assets, release/android icons and the
# `gradle-wrapper.jar` through Git LFS (see .gitattributes `*.jar filter=lfs`). When checked out
# with `lfs: false`, those files end up as ~130 byte pointer stubs. Neither the GitHub mirror raw
# endpoint nor `raw.githubusercontent.com` serves the real objects (the GitHub LFS store 404s and
# raw returns the pointer), which is why the final APK step previously failed with
# `Could not find or load main class org.gradle.wrapper.GradleWrapperMain` (empty wrapper JAR).
# The real LFS objects are served anonymously from the official Blender Gitea repository
# (`projects.blender.org`), so we fetch the subset required for the Android build from there
# using the official `git lfs` mechanism, then verify a few critical files by SHA-256.

# ccache was reporting 7% hits: CCACHE_BASEDIR was unset, so every absolute path from the
# runner went into the hash and a fresh runner missed on nearly every translation unit.
# Normalising against the workspace makes hits survive between runs, and checking compiler
# mtimes by content stops header rewrites from invalidating everything.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 6
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository (android branch, no LFS)
        id: checkout
        uses: actions/checkout@v4
        with:
          path: blender
          ref: ${{ github.ref_name }}
          lfs: false

      - name: Resolve required Git LFS files from the official Blender repository
        run: |
          set -o pipefail
          cd blender
          git lfs install --local
          git remote add upstream-lfs https://projects.blender.org/blender/blender.git
          # Only the files needed by the Android build/runtime. The `install` target copies
          # release/datafiles and assets into the portable runtime directory; release/android
          # contains the Gradle skeleton (incl. gradle-wrapper.jar and the webp launcher icons).
          # tests/, release/windows, release/darwin and doc/ are not needed.
          INCLUDE="release/android/**,release/datafiles/**,assets/**,scripts/startup/**"
          # Objects for some release/android icons 404 on both servers, and both commands
          # exit non-zero over them, which would abort before any compilation starts.
          git lfs fetch upstream-lfs --include "$INCLUDE" \
            || echo "::warning::some LFS objects unavailable; continuing"
          git lfs pull --include "$INCLUDE" \
            || echo "::warning::some LFS objects unavailable; continuing"
          echo "LFS files resolved."

      - name: Verify resolved LFS files (gradle wrapper, launcher icons, startup.blend)
        run: |
          set -o pipefail
          cd blender
          JAR=release/android/gradle/wrapper/gradle-wrapper.jar
          SZ=$(stat -c%s "$JAR")
          echo "gradle-wrapper.jar size: $SZ (expected 54213, a stub is 130)"
          [ "$SZ" = "54213" ] || { echo "ERROR: gradle-wrapper.jar is still an LFS stub"; exit 1; }
          HASH=$(sha256sum "$JAR" | awk '{print $1}')
          echo "gradle-wrapper.jar sha256: $HASH"
          [ "$HASH" = "2c23278a62dc9f96ab11bee897d9f53e6479d6419135e4560ce822a6431df5e5" ] \
            || { echo "ERROR: gradle-wrapper.jar sha256 mismatch"; exit 1; }
          python3 -c "import zipfile; z=zipfile.ZipFile('$JAR'); assert 'org/gradle/wrapper/GradleWrapperMain.class' in z.namelist(); print('GradleWrapperMain.class present')"
          # Launcher icons are referenced by the manifest; aapt2 fails on pointer stubs.
          # A stub here is reported, not fatal: the upstream icon set is incomplete and the
          # Gradle project carries its own mipmaps.
          for f in $(git ls-files 'release/android/app/src/main/res/mipmap-*/ic_launcher*.webp'); do
            [ -e "$f" ] || { echo "::warning::$f absent"; continue; }
            MAGIC=$(head -c4 "$f" | od -An -tx1 | tr -d ' \n')
            [ "$MAGIC" = "52494646" ] && echo "OK $f" \
              || echo "::warning::$f is a stub (magic=$MAGIC)"
          done
          SIZE_SB=$(stat -c%s release/datafiles/startup.blend)
          echo "startup.blend size: $SIZE_SB (real content, not a dummy)"
          [ "$SIZE_SB" -gt 1024 ] || { echo "ERROR: startup.blend is empty/stub"; exit 1; }
          echo "=== remaining git modifications (should be empty) ==="
          git status --short | head -20
          echo "Required LFS files verified OK."

      - name: Resolve precompiled libs commit IDs
        id: libs-commit
        run: |
          echo "arm=$(git ls-remote https://projects.blender.org/blender/lib-android_arm64.git HEAD | cut -f1)" >> $GITHUB_OUTPUT
          echo "x64=$(git ls-remote https://projects.blender.org/blender/lib-linux_x64.git HEAD | cut -f1)" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: cache-libs-android
        with:
          path: blender/lib/android_arm64
          key: libs-android-${{ steps.libs-commit.outputs.arm }}

      - uses: actions/cache/restore@v4
        id: cache-libs-x64
        with:
          path: blender/lib/linux_x64
          key: libs-x64-${{ steps.libs-commit.outputs.x64 }}

      - name: Clone precompiled libs (Android ARM64 — target build)
        if: steps.cache-libs-android.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          git clone --depth 1 https://projects.blender.org/blender/lib-android_arm64.git blender/lib/android_arm64
          cd blender/lib/android_arm64
          git lfs install
          git lfs pull

      - name: Clone precompiled libs (Linux x64 — host_tools)
        if: steps.cache-libs-x64.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          git clone --depth 1 https://projects.blender.org/blender/lib-linux_x64.git blender/lib/linux_x64
          cd blender/lib/linux_x64
          git lfs install
          git lfs pull

      - uses: actions/cache/save@v4
        if: steps.cache-libs-android.outputs.cache-hit != 'true'
        with:
          path: blender/lib/android_arm64
          key: libs-android-${{ steps.libs-commit.outputs.arm }}

      - uses: actions/cache/save@v4
        if: steps.cache-libs-x64.outputs.cache-hit != 'true'
        with:
          path: blender/lib/linux_x64
          key: libs-x64-${{ steps.libs-commit.outputs.x64 }}

      # LIBDIR resolves to lib/android_arm64, which is exactly where the clone puts them.
      # No alias needed.
      - name: Verify libs
        run: |
          set -o pipefail
          # The libs are LFS-backed and the clone step is skipped on a cache hit, so the
          # objects are not guaranteed to be present. platform_android.cmake hardcodes
          # lib/android_arm64/python/lib/libpython3.13.so as PYTHON_LIBRARY, and ninja then
          # stops with "missing and no known rule to make it" when that file is still a
          # 130 byte pointer.
          for d in android_arm64 linux_x64; do
            if [ -d "blender/lib/$d" ]; then
              ( cd "blender/lib/$d" && git lfs install && git lfs pull ) || \
                echo "::warning::lfs pull incomplete for $d"
            fi
          done
          SZ_PY=$(stat -c%s blender/lib/android_arm64/python/lib/libpython3.13.so 2>/dev/null || echo 0)
          echo "libpython3.13.a: $SZ_PY bytes"
          [ "$SZ_PY" -gt 1024 ] || { echo "ERROR: libpython3.13.a still a stub"; exit 1; }
          # .deps/** goes through LFS, and the checkout uses lfs: false, so the zip is a
          # 130 byte pointer until it is pulled here.
          if [ ! -s blender/.deps/jolt.zip ] || [ "$(stat -c%s blender/.deps/jolt.zip)" -lt 1000000 ]; then
            echo "Pulling .deps through LFS"
            ( cd blender && git lfs pull --include=".deps/**" ) || \
              echo "::warning::lfs pull failed for .deps"
          fi
          # Jolt is not in lib-android_arm64, so it travels in the tree.
          if [ ! -d blender/lib/android_arm64/jolt/lib/cmake/Jolt ]; then
            echo "Installing Jolt from .deps/jolt.zip"
            python3 -c "import shutil; shutil.unpack_archive('blender/.deps/jolt.zip', 'blender/lib/android_arm64')"
          fi
          test -f blender/lib/android_arm64/jolt/lib/cmake/Jolt/JoltConfig.cmake \
            || { echo "ERROR: Jolt cmake config missing"; exit 1; }
          # lib-android_arm64's opensubdiv is missing the seven GL headers beta includes
          # (glPatchTable.h and friends). They are declarations, not code, so taking them
          # from the linux tree keeps subdivision working instead of turning it off.
          if [ ! -f blender/lib/android_arm64/opensubdiv/include/opensubdiv/osd/glPatchTable.h ]; then
            echo "Adding missing opensubdiv GL headers"
            python3 -c "import shutil; shutil.unpack_archive('blender/.deps/opensubdiv.zip', 'blender/lib/android_arm64')"
          fi
          test -f blender/lib/android_arm64/opensubdiv/include/opensubdiv/osd/glPatchTable.h \
            || { echo "ERROR: opensubdiv headers still incomplete"; exit 1; }
          echo "Jolt: $(stat -c%s blender/lib/android_arm64/jolt/lib/libJolt.so) bytes"
          ls -la blender/lib/
          SIZE_ARM=$(stat -c%s blender/lib/android_arm64/zstd/lib/libzstd.a 2>/dev/null || echo 0)
          echo "ARM64 zstd.a: $SIZE_ARM bytes"
          SIZE_X64=$(stat -c%s blender/lib/linux_x64/zstd/lib/libzstd.a 2>/dev/null || echo 0)
          echo "x64 zstd.a: $SIZE_X64 bytes"
          if [ "$SIZE_ARM" -lt 1000 ] || [ "$SIZE_X64" -lt 1000 ]; then
            echo "ERROR: LFS pointer not resolved"
            exit 1
          fi
          echo "Both libs OK"

      # 'r30' resolves to 30.0.16248370, whose libc++_shared.so exports
      # std::__ndk1::__hash_memory -- the symbol libblender.so needs from the prebuilt
      # abseil/draco archives. r28c and r29 do not. build-apk.yml must set up the same
      # 'r30', because package.sh copies libc++_shared.so out of the NDK sysroot and an
      # env.sh default of NDK 28 would ship a libc++ without that symbol.
      # Never pin the semver '30.0.14904198' here: that is r30-beta1 (a <preview>1</preview>
      # entry) and setup-ndk 404s on it.
      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
          link-to-sdk: true

      - name: Verify NDK and Vulkan Headers
        run: |
          set -o pipefail
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "========================================"
          echo "1. ANDROID_NDK_ROOT: $NDK_PATH"
          echo "Output ndk-full-version: ${{ steps.setup-ndk.outputs.ndk-full-version }}"
          echo "========================================"
          echo "2. NDK source.properties:"
          cat "$NDK_PATH/source.properties"
          echo "========================================"
          echo "3. Clang version:"
          CLANG_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          if [ -x "$CLANG_BIN" ]; then
            "$CLANG_BIN" --version
          else
            echo "Clang binary not found at standard path, searching..."
            find "$NDK_PATH" -name "clang" -type f
          fi
          echo "========================================"
          echo "4. vulkan_core.h path and version:"
          VK_HEADER="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan_core.h"
          echo "vulkan_core.h path: $VK_HEADER"
          if [ -f "$VK_HEADER" ]; then
            echo "VK_HEADER_VERSION:"
            grep "#define VK_HEADER_VERSION " "$VK_HEADER"
            echo "========================================"
            echo "5. Checking required Vulkan features:"
            grep -Hn "VkPhysicalDeviceDynamicRenderingUnusedAttachmentsFeaturesEXT" "$VK_HEADER"
            grep -Hn "VkPhysicalDeviceDynamicRenderingLocalReadFeaturesKHR" "$VK_HEADER"
            grep -Hn "VK_EXT_DYNAMIC_RENDERING_UNUSED_ATTACHMENTS_EXTENSION_NAME" "$VK_HEADER"
            grep -Hn "VK_KHR_DYNAMIC_RENDERING_LOCAL_READ_EXTENSION_NAME" "$VK_HEADER"
            echo "Vulkan types and extensions check PASSED."
          else
            echo "ERROR: vulkan_core.h not found at $VK_HEADER"
            exit 1
          fi
          echo "========================================"

      - name: Install host build tools
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build pkg-config python3-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          gcc --version | head -1
          g++ --version | head -1

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ runner.os }}-blender-android-ndk30
          max-size: 10G

      # NOTE: no cache for blender/build. A restored ninja tree kept a stale
      # build.ninja (mtime equal to the checked-out CMakeLists after cache
      # extraction) so cmake never reconfigured: the link missed the new NDK
      # glue object and libblender.so shipped without ANativeActivity_onCreate
      # (crash on device: "undefined symbol"). ccache above is enough.

      # Incremental builds. Keyed on the branch, not the commit: a per-sha key misses on
      # every new commit and rebuilds all ~7600 targets, which is why builds here took an
      # hour each. cmake/ninja re-run themselves when CMakeLists or headers change, and
      # ccache below still filters what actually recompiles.
      - name: Restore ninja build tree
        id: cache-builddir
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: blender/build
          # Keyed on the commit that ran configure, not on the branch, and saved even when
          # the build later fails. That gives an incremental next run -- worth far more here
          # than the staleness it risks, because a tree saved by a failed build is still
          # valid for everything that did compile; ninja recompiles what changed and cmake
          # re-runs when a CMakeLists moved.
          key: builddir-android-${{ runner.os }}-${{ github.sha }}
          # Prefix fallback is the point here: this tree exists so that changing one
          # .cc or .hh recompiles what depends on it instead of all ~7700 targets. An
          # exact-only key is a full rebuild every single time, which is an hour per
          # compile-fix cycle.
          restore-keys: |
            builddir-android-${{ runner.os }}-
          enableCrossOsArchive: false

      # 5.3 beta added platform_android.cmake, which refuses to configure until the host
      # code generators exist. They are not in any prebuilt package -- makesdna, makesrna,
      # datatoc, msgfmt and shader_tool are built from this tree for the host, because
      # makesrna must carry exactly the same WITH_* flags as the target or the RNA it
      # generates silently lacks its registration callbacks. The alpha port never needed
      # this: platform_android.cmake did not exist yet.
      # USD's prebuilt headers target an older libstdc++: pxr/base/tf/hashmap.h uses
      # __gnu_cxx::{hash,equal_to,allocator,hash_map} and __gnu_cxx::__stl_next_prime,
      # none of which resolve under the NDK r30 toolchain ("no member named
      # '__stl_next_prime' in namespace '__gnu_cxx'"). All of those moved to std::, so the
      # mapping is one to one. Patching the header is the alternative to dropping USD, and
      # the libs are already there.
      - name: Patch USD headers for the NDK toolchain
        run: |
          set -o pipefail
          H=blender/lib/android_arm64/usd/include
          if [ ! -d "$H" ]; then
            echo "::warning::no USD headers, skipping"
            exit 0
          fi
          echo "files referencing __gnu_cxx: $(grep -rl "__gnu_cxx" "$H" | wc -l)"
          grep -rl "__gnu_cxx" "$H" | while read -r f; do
            # hash_map -> unordered_map, and the rest are plain moves into std::.
            # The NDK r30 toolchain ships libc++, not libstdc++, so __gnu_cxx does not
            # exist at all. The four container names must NOT be aliased here: libc++
            # already declares __gnu_cxx::hash_set in its own ext/hash_set, and redefining
            # it is "redefinition of 'hash_set' as different kind of symbol". Only the
            # three names with no libc++ equivalent are redirected, to std::.
            sed -i -e 's/__gnu_cxx::hash</std::hash</g' \
                   -e 's/__gnu_cxx::equal_to</std::equal_to</g' \
                   -e 's/__gnu_cxx::allocator</std::allocator</g' \
                   -e 's/__gnu_cxx::__stl_next_prime/std::__next_prime/g' "$f"
          done
          echo "USD headers patched"

      - name: Build host code generators
        run: |
          set -o pipefail
          cd blender
          FEATURES=build_files/android/android_features_full.cmake
          cmake -S . -B build_host_tools_full -G Ninja -C "$FEATURES" \
            -DWITH_CROSSCOMPILED_TOOLS=OFF \
            -DWITH_HEADLESS=ON -DWITH_X11_XINPUT=OFF -DWITH_AUDASPACE=OFF \
            -DWITH_COMPILER_CCACHE=ON \
            -DCMAKE_BUILD_RPATH="$PWD/lib/linux_x64/tbb/lib"
          cmake --build build_host_tools_full --target makesdna makesrna datatoc msgfmt shader_tool -j"$(nproc)"
          ls -la build_host_tools_full/bin/

      # bf_io_usd does not compile against the NDK r30 toolchain: the prebuilt USD headers
      # use __gnu_cxx::__stl_next_prime, __gnu_cxx::equal_to and __gnu_cxx::allocator,
      # which moved to std:: in the newer libstdc++. Nothing to fix in this tree. USD is a
      # file format importer with no bearing on rendering, the shortcut panel or the UI
      # work this branch exists to test, so it and the other heavyweight importers are off
      # for the beta test. BUILD_BASE is pointed at the source dir because this pipeline
      # keeps the harvested deps in lib/android_arm64 rather than ../blender_build_android.
      - name: Create missing operator data-files
        run: |
          set -o pipefail
          # source/creator/CMakeLists.txt installs one .dat per ICON_GEOM_NAMES entry.
          # beta lists ops.gpencil.carver but never ships the file, so install stops with
          # 'file INSTALL cannot find .../release/datafiles/icons/ops.gpencil.carver.dat'.
          # These hold operator geometry for the icon brushes; an empty one falls back to
          # defaults, which is better than failing the whole build over a brush.
          cd blender
          python3 - << 'PYEOF'
          import pathlib, re
          t = pathlib.Path("source/blender/editors/datafiles/CMakeLists.txt").read_text()
          m = re.search(r"ICON_GEOM_NAMES(.*?)# END ICON_GEOM_NAMES", t, re.S)
          d = pathlib.Path("release/datafiles/icons")
          missing = []
          for line in m.group(1).splitlines():
              n = line.strip()
              if not n or n.startswith("#"):
                  continue
              f = d / (n + ".dat")
              if not f.exists():
                  f.write_bytes(b"")
                  missing.append(f.name)
          print("created %d placeholder(s): %s" % (len(missing), missing))
          PYEOF

      # The prebuilt lib-android_arm64 ships an FFmpeg whose libavdevice pulls -lpthread onto
      # the link line, and bionic has no libpthread.so: the link failed with "unable to find
      # library -lpthread". It also carries the android_camera input device, whose ACamera*
      # symbols had to be chased through the NDK. Rebuilding FFmpeg with the repo's own deps
      # builder avoids both, and is what the reference port does on every run.
      # FFmpeg plus its codec deps is ~7 minutes of the build. Cached separately so only the
      # runs that change the source pay for it.
      - name: Restore FFmpeg rebuild
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: blender/lib/android_arm64/ffmpeg
          key: ffmpeg-ndk30final-static-${{ steps.libs-commit.outputs.arm }}

      - name: Rebuild FFmpeg for this toolchain
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          cd blender
          export BUILD_BASE="$GITHUB_WORKSPACE/blender"
          export LIBDIR="$BUILD_BASE/lib/android_arm64"
          export ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_VERSION="${{ steps.setup-ndk.outputs.ndk-full-version }}"
          export ANDROID_API=31
          if [ -f "$LIBDIR/ffmpeg/lib/libavcodec.so" ] && \
             [ "$LIBDIR/ffmpeg/.rebuilt-for-ndk30" = 1 ]; then
            echo "FFmpeg already rebuilt for this toolchain; skipping"
            exit 0
          fi
          bash build_files/android/deps/build.sh \
            openjpeg ogg vorbis theora opus lame aom x265 vpx x264
          bash build_files/android/deps/build.sh ffmpeg
          touch "$LIBDIR/ffmpeg/.rebuilt-for-ndk30"
          ls -la "$LIBDIR/ffmpeg/lib/" | head -8

      - name: Save FFmpeg rebuild
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: blender/lib/android_arm64/ffmpeg
          key: ffmpeg-ndk30final-static-${{ steps.libs-commit.outputs.arm }}

      - name: Configure CMake
        id: cmake-attempt1
        run: |
          set -o pipefail
          cd blender
          # It has to come after the -C on the command line to win, which is why this
          # sits above the cmake line and not inline in it: a '#' comment between
          # backslash-continued lines eats the trailing backslash, the command splits
          # in half, and the next flag runs as its own program.
          # After the -C so it wins: blender_release.cmake does
          # set(WITH_TBB_MALLOC_PROXY ON CACHE BOOL "" FORCE). tbbmalloc tags its
          # pointers on arm64, so one reaching bionic's free() instead of the proxy's
          # aborts the process at dlopen, inside whatever library's static constructor is
          # running at the time -- which reads as a bug in that library, not in this:
          #   Abort message: 'Pointer tag for 0x... was truncated'
          #     #05 linker64 __dl__ZN6soinfo17call_constructorsEv
          # The tell is libblender.so's DT_NEEDED: with the proxy it gains
          # libtbbmalloc.so and libtbbmalloc_proxy.so.
          cmake -B build \
            -S . \
            -DTARGET_ANDROID=ON \
            -DCMAKE_TOOLCHAIN_FILE=build_files/cmake/platform/platform_android_toolchain.cmake \
            -DANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }} \
            -DCMAKE_INSTALL_PREFIX=install \
            -DBLENDER_ANDROID_CONFIG=full \
            -DBUILD_BASE=${{ github.workspace }}/blender \
            -C build_files/cmake/config/blender_release.cmake \
            -DWITH_TBB_MALLOC_PROXY=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_PYTHON_INSTALL=ON \
            -DWITH_COMPILER_CCACHE=ON \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_GHOST_X11=OFF \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DTEST_PYTHON_EXE=$(which python3) \
            -GNinja 2>&1 | tee cmake_config.log

      - name: Handle CMake failure
        if: steps.cmake-attempt1.outcome == 'failure'
        run: |
          cat cmake_config.log
          exit 1

      - name: Build and stage Gradle project
        if: steps.cmake-attempt1.outcome == 'success'
        run: |
          set -o pipefail
          cd blender
          # Build the native targets directly, then stage. build_apk.sh is not used: it
          # reconfigures with its own BUILD_BASE (env.sh defaults to NDK 28), which wrote
          # the .so somewhere package.sh was not looking. package.sh collects libblender.so
          # from build/lib, which is where the configure above puts it.
          ninja -C build blender bf_intern_meshopt_bridge bf_intern_draco_bridge 2>&1 | tee build.log
          echo "=== libblender.so ==="
          ls -l build/lib/libblender.so
          # package.sh copies libc++_shared.so out of the NDK sysroot, so the NDK it sees has to
          # be the one this job compiled and linked against. env.sh resolves it as
          #     ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT:-$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION}"
          # -- and the GitHub runner image already exports ANDROID_NDK_ROOT pointing at
          # whichever NDK it ships with (27.3.13750724 on ubuntu-latest at the time of
          # writing). That ${ANDROID_NDK_ROOT:-...} then wins over ANDROID_NDK_VERSION and
          # the runner's libc++ lands in the APK. That is what produced the launch failure:
          #   [blender-android] NDK   : /usr/local/lib/android/sdk/ndk/27.3.13750724
          # r27d's libc++_shared.so does not export std::__ndk1::__hash_memory, which
          # libblender.so references from the prebuilt abseil/draco archives, so every
          # launch died at System.loadLibrary with
          #   cannot locate symbol _ZNSt6__ndk113__hash_memoryEPKvm referenced by libblender.so
          # Export ANDROID_NDK_ROOT explicitly rather than relying on ANDROID_NDK_VERSION.
          NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_ROOT="$NDK_ROOT"
          export ANDROID_NDK_HOME="$NDK_ROOT"
          export ANDROID_NDK_VERSION="${{ steps.setup-ndk.outputs.ndk-full-version }}"
          export ANDROID_API=31
          # ANDROID_HOME must contain the SDK build-tools and platforms package.sh looks
          # for, and the runner's pre-set value is the one that actually has them.
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          # Fail here rather than silently staging the wrong STL.
          test -s "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            || { echo "ERROR: no sysroot libc++_shared.so under $ANDROID_NDK_ROOT"; exit 1; }
          if ! readelf --dyn-syms -W \
              "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
              | grep -q _ZNSt6__ndk113__hash_memoryEPKvm; then
            echo "ERROR: $ANDROID_NDK_ROOT's libc++_shared.so does not export __ndk1::__hash_memory"
            exit 1
          fi
          echo "staging with NDK: $ANDROID_NDK_ROOT (version $ANDROID_NDK_VERSION)"
          # package.sh derives both the library dir and the stage dir from BUILD_BASE, so it
          # has to match the -DBUILD_BASE the configure above was given.
          export BUILD_BASE="${GITHUB_WORKSPACE}/blender"
          BLENDER_ANDROID_CONFIG=full BUILD="$PWD/build" bash build_files/android/apk/package.sh --stage-only 2>&1 | tee stage.log
          # The staged payload is what the APK job consumes, so verify the file that is
          # actually going to ship rather than the NDK we meant to use.
          STAGED="$BUILD_BASE/android_apk_stage_full/lib/arm64-v8a/libc++_shared.so"
          test -s "$STAGED" || { echo "ERROR: staged payload has no libc++_shared.so"; exit 1; }
          readelf --dyn-syms -W "$STAGED" | grep -q _ZNSt6__ndk113__hash_memoryEPKvm \
            || { echo "ERROR: staged libc++_shared.so is missing __hash_memory -- wrong NDK"; exit 1; }
          # ANativeActivity_onCreate must be in .dynsym, not just in the link. NativeActivity
          # .onCreate dlsym()s that exact name out of whatever System.loadLibrary returned,
          # and 'local: *' in symbols_android.map hides anything not listed there -- so the
          # APK installs fine and then dies in onCreate. Assert it on the staged library,
          # where the problem is visible, rather than on a phone, where it is not.
          # $JNI lives inside package.sh and does not survive the call, so rebuild the path
          # the way package.sh does: STAGE="$BUILD_BASE/android_apk_stage_$CONFIG", JNI="$STAGE/lib/arm64-v8a".
          STAGED_SO="$BUILD_BASE/android_apk_stage_full/lib/arm64-v8a/libblender.so"
          test -s "$STAGED_SO" || { echo "ERROR: no staged libblender.so at $STAGED_SO"; exit 1; }
          if readelf --dyn-syms -W "$STAGED_SO" | grep -q ANativeActivity_onCreate; then
            echo "staged libblender.so exports ANativeActivity_onCreate"
          else
            echo "ERROR: staged libblender.so does not export ANativeActivity_onCreate"
            echo "       symbols_android.map needs it in its global: list"
            exit 1
          fi
          # Same trap for the JNI entry points, and it is quieter: the library loads,
          # the app starts, and the failure only appears the first time a method is
          # called -- "No implementation found for void ...BlenderActivity.nativeXxx".
          # That is how a build can sit here looking perfect while the Kronos
          # shortcuts panel, the on-screen keyboard and .blend opening are all dead.
          MISSING=""
          for sym in nativeOnCommitText nativeOnKey nativeOpenMainFile \
                     nativeSendKeyCombo nativeSetModifierLatched; do
            readelf --dyn-syms -W "$STAGED_SO" \
              | grep -q "Java_com_kronos3d_app_BlenderActivity_$sym" || MISSING="$MISSING $sym"
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: staged libblender.so exports no JNI symbol for:$MISSING"
            echo "       symbols_android.map needs 'Java_*;' in its global: list"
            exit 1
          fi
          echo "staged libblender.so exports all five JNI entry points"
          if readelf -d "$STAGED_SO" | grep NEEDED | grep -q libtbbmalloc_proxy; then
            echo "ERROR: staged libblender.so links libtbbmalloc_proxy.so (allocator mismatch)"
            exit 1
          fi
          echo "staged libblender.so: no tbbmalloc proxy"
          echo "staged libblender.so build-id: $(readelf -n "$STAGED_SO" | grep -oE '[0-9a-f]{40}' | head -1)"
          echo "staged libblender.so sha256:  $(sha256sum "$STAGED_SO" | awk '{print $1}')"
          echo "staged libc++_shared.so OK"

      # AFTER the build, never before it: placed above, blender/build does not exist yet,
      # the save finishes in zero seconds with an empty archive, and the next run misses
      # again. It was missing from this workflow entirely, which is why every run rebuilt
      # all ~7700 targets -- an hour per compile-fix cycle. always() so a tree that got as
      # far as linking is still banked for the next attempt.
      - name: Save ninja build tree
        if: always() && steps.cache-builddir.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: blender/build
          key: builddir-android-${{ runner.os }}-${{ github.sha }}

      - name: Package staged Gradle project
        if: steps.cmake-attempt1.outcome == 'success'
        run: |
          set -o pipefail
          # package.sh --stage-only stages the payload (lib/, assets/) next to the source
          # dir, since BUILD_BASE points there; the Gradle project itself is still the
          # checkout's build_files/android/apk. Ship both, since assembleRelease needs the
          # project and the payload together to find jniLibs and assets.
          SRC="$GITHUB_WORKSPACE/blender"
          test -d "$SRC/android_apk_stage_full" \
            || { echo "ERROR: stage missing; package.sh did not run"; exit 1; }
          # The staged project embeds machine-specific settings from the build job runner.
          rm -f "$SRC/android_apk_stage_full/local.properties"
          cd "$SRC"
          # FFmpeg is rebuilt against this NDK, which makes its codec libraries shared
          # (libaom.so and friends) rather than the static archives the prebuilt tree
          # ships. libblender.so then carries DT_NEEDED entries for them, and the packaging
          # job cannot copy what it never receives, so the APK shipped without them and the
          # app died on 'dlopen failed: library libaom.so not found'. Ship them.
          tar -I 'zstd -T0' -cf "$GITHUB_WORKSPACE/gradle-stage.tar.zst" \
            --exclude='build_files/android/apk/.gradle' \
            --exclude='build_files/android/apk/app/build' \
            android_apk_stage_full build_files/android/apk lib/android_arm64/ffmpeg
          echo "Staged size: $(du -sh "$GITHUB_WORKSPACE/gradle-stage.tar.zst" | awk '{print $1}')"

      # Only cache a tree whose configure succeeded. A cache written from a run that
      # later failed carries the previous feature flags forward: with WITH_USD off the
      # configure is clean, but a restored tree still carried rna_usd_gen.cc and the build
      # died on 'no such file or directory: rna_usd_gen.cc' long after the flag had been
      # changed. This is the stale-ninja-tree problem the original workflow warned about,
      # narrowed to the case that actually bit: caching after a failure.
      # success(), not always(): a tree restored from a cache written by a run with a
      # different generator fails configure outright with 'Does not match the generator
      # used previously: Unix Makefiles', and a half-built tree carries its CMakeCache
      # with it. Only cache a configure that completed cleanly.
      - name: Upload staged Gradle project
        if: steps.cmake-attempt1.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-stage
          path: gradle-stage.tar.zst
          retention-days: 7
          if-no-files-found: error

      # The staged Gradle project carries a *stripped* libblender.so:
      # platform_android_stage.cmake runs llvm-strip --strip-unneeded on the way
      # in. That leaves 14 exported symbols and no .symtab, so a tombstone frame
      # resolves to "somewhere after ANativeActivity_onCreate" and a crash cannot
      # be located. build/lib/libblender.so is the same file before that step, with
      # its symbol table intact. Upload it alongside the BuildId so frames can be
      # resolved with addr2line against the exact binary that crashed.
      - name: Upload unstripped libblender.so for symbolization
        if: steps.cmake-attempt1.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-symbols
          # The checkout lands in `blender/` and the build step does `cd blender`, so from
          # the workspace root the pre-strip library is here.
          path: blender/build/lib/libblender.so
          retention-days: 7
          # Never fail the build over this: the compile is the expensive part, and losing
          # the symbols costs one future diagnosis rather than this run.
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/cmake_config*.log
            blender/build.log
            blender/gradle_stage.log
            *.log
          if-no-files-found: ignore
